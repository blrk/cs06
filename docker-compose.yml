version: '3.8'

services:
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: yes
    networks:
      - kafka-net

  kafka:
    image: bitnami/kafka:3.4
    container_name: kafka
    hostname: kafka  
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092
      ALLOW_PLAINTEXT_LISTENER: yes
    depends_on:
      - zookeeper
    networks:
      - kafka-net

  spark-master:
    image: bitnami/spark:3.4
    container_name: spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080" # Spark Master UI
    networks:
      - kafka-net

  spark-worker:
    image: bitnami/spark:3.4
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    networks:
      - kafka-net

  streamapp:
    build:
      context: ./stream/
    container_name: streamapp
    ports:
      - "5000:5000"
    depends_on:
      - kafka
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kafka-net
  
  spark-kafka-consumer:
    build:
      context: ./spark
    container_name: kafaka-consumer
    depends_on:
      streamapp:
        condition: service_healthy
    restart: on-failure
    networks:
      - kafka-net  
    command: ["/bin/bash", "-c", "sleep 30  && /opt/bitnami/spark/bin/spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.4.0,org.elasticsearch:elasticsearch-spark-30_2.12:8.18.3 /opt/bitnami/spark/app/spark_kafka_consumer.py"]
  
  elasticsearch:
    build: ./elastic-search
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
    volumes:
      - esdata:/opt/elasticsearch/data
      - eslogs:/opt/elasticsearch/logs
    networks:
      - kafka-net
  
  grafana:
    build: ./grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./datasource.yaml:/usr/share/grafana/conf/provisioning/datasources/datasource.yaml
    depends_on:
      - elasticsearch
    networks:
      - kafka-net

volumes:
  esdata:
  eslogs:  
  grafana-storage:

networks:
  kafka-net:
    driver: bridge
